<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Resume</title>

    <link
        rel="stylesheet"
        href="../../shared/css/common.css"
    >

    <link
        rel="stylesheet"
        href="../css/auth.css"
    >

</head>


<body>


    <!-- ==========================================
         NAVIGATION
    =========================================== -->

    <nav class="navbar">

        <span class="brand">
            Recruitment Resume Filter
        </span>


        <div>

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="profile.html">
                Profile
            </a>

            <a href="education.html">
                Education
            </a>

            <a href="skills.html">
                Skills
            </a>

            <a href="resume.html">
                Resume
            </a>

            <a href="login.html">
                Logout
            </a>

        </div>

    </nav>



    <!-- ==========================================
         RESUME SECTION
    =========================================== -->

    <div class="container">

        <div class="auth-card card">


            <span class="eyebrow">
                Student Portal
            </span>


            <h2>
                Resume
            </h2>


            <p class="login-description">
                Upload your latest resume for recruiters to review.
            </p>



            <!-- ==================================
                 RESUME FORM
            =================================== -->

            <form id="resumeForm">


                <!-- Resume Upload -->

                <div class="form-group">

                    <label for="resumeFile">
                        Upload Resume
                    </label>


                    <input
                        type="file"
                        id="resumeFile"
                        accept=".pdf,application/pdf"
                    >


                    <small
                        style="
                            display: block;
                            margin-top: 0.4rem;
                            color: var(--text-muted);
                        "
                    >
                        PDF only. Maximum file size: 5 MB.
                    </small>

                </div>



                <!-- ==================================
                     SELECTED RESUME INFORMATION
                =================================== -->

                <div
                    id="resumeInfo"
                    style="
                        display: none;
                        margin-top: 1rem;
                        padding: 1rem;
                        border: 1px solid var(--border);
                        border-radius: var(--radius);
                        background: var(--paper);
                    "
                >

                    <strong>
                        Selected Resume
                    </strong>


                    <p
                        id="resumeFileName"
                        style="margin-top: 0.4rem;"
                    >
                    </p>


                    <p
                        id="resumeFileSize"
                        style="
                            font-size: 0.85rem;
                            color: var(--text-muted);
                        "
                    >
                    </p>

                </div>



                <!-- ==================================
                     BUTTONS
                =================================== -->

                <div
                    style="
                        display: flex;
                        gap: 0.75rem;
                        margin-top: 1.25rem;
                        flex-wrap: wrap;
                    "
                >


                    <!-- Save -->

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Save Resume
                    </button>



                    <!-- Remove -->

                    <button
                        type="button"
                        id="removeResumeBtn"
                        class="btn btn-secondary"
                        style="display: none;"
                    >
                        Remove Resume
                    </button>


                </div>



                <!-- ==================================
                     MESSAGE
                =================================== -->

                <div id="resumeMessage"></div>


            </form>


        </div>

    </div>



    <!-- ==========================================
         JAVASCRIPT
    =========================================== -->

    <script src="../js/resume.js"></script>


</body>

</html>
