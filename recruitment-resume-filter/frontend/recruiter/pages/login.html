<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recruiter Login</title>

    <!-- Common CSS -->
    <link rel="stylesheet" href="../css/common.css">

    <!-- Auth CSS -->
    <link rel="stylesheet" href="../css/auth.css">
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="brand">Recruitment Portal</div>

        <div class="nav-links">
            <a href="../../index.html">Home</a>
            <a href="register.html">Register</a>
        </div>
    </nav>


    <!-- Login Section -->
    <main class="auth-container">

        <div class="auth-card">

            <h1>Recruiter Login</h1>

            <p class="subtitle">
                Login to access the Recruiter Dashboard
            </p>

            <form id="loginForm">

                <!-- Email -->
                <div class="form-group">
                    <label for="email">Staff Email ID</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="123456789@sastra.ac.in"
                        required
                    >
                </div>


                <!-- Password -->
                <div class="form-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter 6 digit password"
                        maxlength="6"
                        required
                    >
                </div>


                <!-- Login Button -->
                <button type="submit" class="btn btn-primary">
                    Login
                </button>

            </form>


            <!-- Register Link -->
            <p class="auth-link">
                Don't have an account?
                <a href="register.html">Register here</a>
            </p>

        </div>

    </main>


    <!-- Login JavaScript -->
    <script>

        document.addEventListener("DOMContentLoaded", function () {

            const loginForm = document.getElementById("loginForm");

            loginForm.addEventListener("submit", function (event) {

                event.preventDefault();

                const email = document.getElementById("email").value.trim();
                const password = document.getElementById("password").value.trim();


                // Get registered details
                const registeredEmail =
                    localStorage.getItem("recruiterEmail");

                const registeredPassword =
                    localStorage.getItem("recruiterPassword");


                // Check login details
                if (
                    email === registeredEmail &&
                    password === registeredPassword
                ) {

                    // Store login status
                    localStorage.setItem("loggedIn", "true");
                    localStorage.setItem("loginEmail", email);


                    // Success message
                    alert("Login successful!");


                    // ⭐ IMPORTANT ⭐
                    // Open dashboard after clicking OK
                    window.location.href = "/frontend/recruiter/pages/dashboard.html";

                } else {

                    alert("Invalid Email ID or Password.");

                }

            });

        });

    </script>

</body>
</html>
