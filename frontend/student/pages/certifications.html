<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Certifications</title>

    <link rel="stylesheet" href="../../shared/css/common.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar">

        <span class="brand">Recruitment Resume Filter</span>

        <div>
            <a href="dashboard.html">Dashboard</a>
            <a href="profile.html">Profile</a>
            <a href="education.html">Education</a>
            <a href="skills.html">Skills</a>
            <a href="resume.html">Resume</a>
            <a href="certifications.html">Certifications</a>
            <a href="login.html">Logout</a>
        </div>

    </nav>


    <!-- Certifications -->
    <div class="container">

        <div class="card">

            <span class="eyebrow">Student Portal</span>

            <h2>Certifications</h2>

            <p class="login-description">
                Add your professional and technical certifications.
            </p>


            <!-- Certification List -->
            <div id="certificationList"></div>


            <!-- Add Certification Button -->
            <button
                type="button"
                id="addCertificationBtn"
                class="btn btn-secondary"
                style="margin-top: 1rem;">
                + Add Certification
            </button>


            <!-- Save All -->
            <div style="margin-top: 1.5rem;">

                <button
                    type="button"
                    id="saveCertificationsBtn"
                    class="btn btn-primary">
                    Save Certifications
                </button>

            </div>


            <!-- Message -->
            <div id="certificationMessage"></div>

        </div>

    </div>


    <script>

        // ==========================================
        // CERTIFICATIONS
        // ==========================================

        const certificationList =
            document.getElementById("certificationList");

        const addCertificationBtn =
            document.getElementById("addCertificationBtn");

        const saveCertificationsBtn =
            document.getElementById("saveCertificationsBtn");

        const certificationMessage =
            document.getElementById("certificationMessage");


        // ==========================================
        // ADD CERTIFICATION
        // ==========================================

        function addCertification() {

            const certificationCard =
                document.createElement("div");

            certificationCard.className = "card";

            certificationCard.style.marginTop = "1.5rem";


            certificationCard.innerHTML = `

                <h3>Certification</h3>

                <!-- Certification Name -->

                <div class="form-group">

                    <label>
                        Certification Name
                    </label>

                    <input
                        type="text"
                        class="certificationName"
                        placeholder="e.g. Python Programming"
                        required
                    >

                </div>


                <!-- Issuing Organization -->

                <div class="form-group">

                    <label>
                        Issuing Organization
                    </label>

                    <input
                        type="text"
                        class="issuingOrganization"
                        placeholder="e.g. Coursera, Udemy, AWS"
                        required
                    >

                </div>


                <!-- Issue Date -->

                <div class="form-group">

                    <label>
                        Issue Date
                    </label>

                    <input
                        type="date"
                        class="issueDate"
                        required
                    >

                </div>


                <!-- Expiry Date -->

                <div class="form-group">

                    <label>
                        Expiry Date
                    </label>

                    <input
                        type="date"
                        class="expiryDate"
                    >

                    <small
                        style="
                            display: block;
                            margin-top: 0.4rem;
                            color: var(--text-muted);
                        ">
                        Leave empty if the certification does not expire.
                    </small>

                </div>


                <!-- Credential ID -->

                <div class="form-group">

                    <label>
                        Credential ID
                    </label>

                    <input
                        type="text"
                        class="credentialId"
                        placeholder="e.g. ABC12345"
                    >

                </div>


                <!-- Credential URL -->

                <div class="form-group">

                    <label>
                        Credential URL
                    </label>

                    <input
                        type="url"
                        class="credentialUrl"
                        placeholder="https://example.com/verify"
                    >

                </div>


                <!-- Certificate File -->

                <div class="form-group">

                    <label>
                        Certificate File
                    </label>

                    <input
                        type="file"
                        class="certificateFile"
                        accept=".pdf,.jpg,.jpeg,.png"
                    >

                    <small
                        style="
                            display: block;
                            margin-top: 0.4rem;
                            color: var(--text-muted);
                        ">
                        PDF, JPG, JPEG or PNG. Maximum 5 MB.
                    </small>

                </div>


                <!-- Remove -->

                <button
                    type="button"
                    class="btn btn-secondary removeCertificationBtn">
                    Remove Certification
                </button>

            `;


            certificationList.appendChild(
                certificationCard
            );


            // Remove button

            const removeButton =
                certificationCard.querySelector(
                    ".removeCertificationBtn"
                );


            removeButton.addEventListener(
                "click",
                () => {

                    certificationCard.remove();

                }
            );


            // Certificate file validation

            const certificateFile =
                certificationCard.querySelector(
                    ".certificateFile"
                );


            certificateFile.addEventListener(
                "change",
                function () {

                    const file =
                        this.files[0];


                    if (!file) {
                        return;
                    }


                    const allowedTypes = [
                        "application/pdf",
                        "image/jpeg",
                        "image/png"
                    ];


                    if (
                        !allowedTypes.includes(file.type)
                    ) {

                        showMessage(
                            "Certificate must be PDF, JPG or PNG.",
                            "error"
                        );

                        this.value = "";

                        return;

                    }


                    // Maximum 5 MB

                    if (
                        file.size >
                        5 * 1024 * 1024
                    ) {

                        showMessage(
                            "Certificate file must be smaller than 5 MB.",
                            "error"
                        );

                        this.value = "";

                    }

                }
            );

        }


        // ==========================================
        // ADD FIRST CERTIFICATION AUTOMATICALLY
        // ==========================================

        addCertification();


        // ==========================================
        // ADD ANOTHER CERTIFICATION
        // ==========================================

        addCertificationBtn.addEventListener(
            "click",
            addCertification
        );


        // ==========================================
        // SAVE CERTIFICATIONS
        // ==========================================

        saveCertificationsBtn.addEventListener(
            "click",
            function () {

                const certifications =
                    document.querySelectorAll(
                        "#certificationList > .card"
                    );


                if (certifications.length === 0) {

                    showMessage(
                        "Please add at least one certification.",
                        "error"
                    );

                    return;

                }


                const certificationData = [];


                for (
                    let i = 0;
                    i < certifications.length;
                    i++
                ) {

                    const card =
                        certifications[i];


                    const name =
                        card.querySelector(
                            ".certificationName"
                        ).value.trim();


                    const organization =
                        card.querySelector(
                            ".issuingOrganization"
                        ).value.trim();


                    const issueDate =
                        card.querySelector(
                            ".issueDate"
                        ).value;


                    const expiryDate =
                        card.querySelector(
                            ".expiryDate"
                        ).value;


                    const credentialId =
                        card.querySelector(
                            ".credentialId"
                        ).value.trim();


                    const credentialUrl =
                        card.querySelector(
                            ".credentialUrl"
                        ).value.trim();


                    const certificateFile =
                        card.querySelector(
                            ".certificateFile"
                        ).files[0];


                    // Required fields

                    if (
                        !name ||
                        !organization ||
                        !issueDate
                    ) {

                        showMessage(
                            "Please fill in the required certification fields.",
                            "error"
                        );

                        return;

                    }


                    // Expiry date validation

                    if (
                        expiryDate &&
                        expiryDate < issueDate
                    ) {

                        showMessage(
                            "Expiry date cannot be before the issue date.",
                            "error"
                        );

                        return;

                    }


                    certificationData.push({

                        name: name,

                        issuingOrganization:
                            organization,

                        issueDate:
                            issueDate,

                        expiryDate:
                            expiryDate || null,

                        credentialId:
                            credentialId,

                        credentialUrl:
                            credentialUrl,

                        certificateFile:
                            certificateFile
                                ? certificateFile.name
                                : null

                    });

                }


                // Temporary frontend save

                console.log(
                    "Certification data:",
                    certificationData
                );


                showMessage(
                    "Certifications saved successfully.",
                    "success"
                );

            }
        );


        // ==========================================
        // MESSAGE
        // ==========================================

        function showMessage(text, type) {

            certificationMessage.textContent =
                text;

            certificationMessage.className =
                "message " + type;

        }

    </script>

</body>

</html>
