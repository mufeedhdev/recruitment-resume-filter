<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Education</title>

    <link rel="stylesheet" href="../../shared/css/common.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar">

        <span class="brand">Recruitment Resume Filter</span>

        <div>
            <a href="dashboard.html">Dashboard</a>
            <a href="profile.html">Profile</a>
            <a href="education.html">Education</a>
            <a href="login.html">Logout</a>
        </div>

    </nav>


    <!-- Education -->
    <div class="container">

        <div class="auth-card card">

            <span class="eyebrow">Student Portal</span>

            <h2>Education</h2>

            <p class="login-description">
                Add your academic qualifications and educational details.
            </p>


            <form id="educationForm">

                <!-- Current Degree -->
                <div class="form-group">

                    <label for="degree">
                        Degree / Course
                    </label>

                    <input
                        type="text"
                        id="degree"
                        placeholder="e.g. BCA"
                        required
                    >

                </div>


                <!-- Institution -->
                <div class="form-group">

                    <label for="institution">
                        Institution
                    </label>

                    <input
                        type="text"
                        id="institution"
                        placeholder="e.g. SASTRA Deemed University"
                        required
                    >

                </div>


                <!-- Department -->
                <div class="form-group">

                    <label for="department">
                        Department
                    </label>

                    <input
                        type="text"
                        id="department"
                        placeholder="e.g. Computer Applications"
                        required
                    >

                </div>


                <!-- Start Year -->
                <div class="form-group">

                    <label for="startYear">
                        Start Year
                    </label>

                    <input
                        type="number"
                        id="startYear"
                        placeholder="e.g. 2024"
                        min="2000"
                        max="2100"
                        required
                    >

                </div>


                <!-- Graduation Year -->
                <div class="form-group">

                    <label for="graduationYear">
                        Expected Graduation Year
                    </label>

                    <input
                        type="number"
                        id="graduationYear"
                        placeholder="e.g. 2027"
                        min="2000"
                        max="2100"
                        required
                    >

                    <small
                        id="graduationYearError"
                        style="color: var(--error); display: none;">
                    </small>

                </div>


                <!-- Current CGPA -->
                <div class="form-group">

                    <label for="cgpa">
                        Current CGPA
                    </label>

                    <input
                        type="number"
                        id="cgpa"
                        step="0.01"
                        min="0"
                        max="10"
                        placeholder="e.g. 8.2"
                        required
                    >

                    <small
                        id="cgpaError"
                        style="color: var(--error); display: none;">
                    </small>

                </div>


                <!-- 10th Details -->
                <h3 class="mt-2">
                    Secondary Education
                </h3>

                <div class="form-group">

                    <label for="tenthSchool">
                        10th School
                    </label>

                    <input
                        type="text"
                        id="tenthSchool"
                        placeholder="School name"
                    >

                </div>


                <div class="form-group">

                    <label for="tenthPercentage">
                        10th Percentage
                    </label>

                    <input
                        type="number"
                        id="tenthPercentage"
                        step="0.01"
                        min="0"
                        max="100"
                        placeholder="e.g. 85.5"
                    >

                </div>


                <!-- 12th Details -->
                <h3 class="mt-2">
                    Higher Secondary Education
                </h3>

                <div class="form-group">

                    <label for="twelfthSchool">
                        12th School
                    </label>

                    <input
                        type="text"
                        id="twelfthSchool"
                        placeholder="School name"
                    >

                </div>


                <div class="form-group">

                    <label for="twelfthPercentage">
                        12th Percentage
                    </label>

                    <input
                        type="number"
                        id="twelfthPercentage"
                        step="0.01"
                        min="0"
                        max="100"
                        placeholder="e.g. 88.5"
                    >

                </div>


                <!-- Save Button -->
                <button
                    type="submit"
                    class="btn btn-primary">
                    Save Education
                </button>


                <!-- Message -->
                <div id="educationMessage"></div>

            </form>

        </div>

    </div>


    <script src="../js/education.js"></script>

</body>

</html>
