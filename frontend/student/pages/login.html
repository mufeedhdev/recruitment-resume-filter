<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Login</title>

    <link rel="stylesheet" href="../../shared/css/common.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar">

        <span class="brand">Recruitment Resume Filter</span>

        <div>
            <a href="../../index.html">Home</a>
            <a href="register.html">Register</a>
        </div>

    </nav>


    <!-- Login -->
    <div class="container">

        <div class="auth-card card">

            <span class="eyebrow">Student Portal</span>

            <h2>Student Login</h2>

            <p class="login-description">
                Login using your registered college email.
            </p>


            <form id="loginForm">

                <!-- College Email -->

                <div class="form-group">

                    <label for="email">
                        College Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="XXXXXXXXX@sastra.ac.in"
                        required
                    >

                    <small
                        id="emailError"
                        style="color: var(--error); display: none;">
                    </small>

                </div>


                <!-- Send OTP -->

                <button
                    type="button"
                    id="sendOtpBtn"
                    class="btn btn-primary">
                    Send OTP
                </button>


                <!-- OTP Section -->

                <div
                    id="otpSection"
                    style="display: none;">

                    <div class="form-group mt-2">

                        <label for="otp">
                            Enter OTP
                        </label>

                        <input
                            type="text"
                            id="otp"
                            placeholder="Enter 6-digit OTP"
                            maxlength="6"
                            inputmode="numeric"
                        >

                        <small
                            id="otpError"
                            style="color: var(--error); display: none;">
                        </small>

                    </div>


                    <button
                        type="submit"
                        class="btn btn-primary">
                        Verify OTP
                    </button>


                    <p class="mt-1 otp-resend">

                        Didn't receive the OTP?

                        <button
                            type="button"
                            id="resendOtpBtn"
                            class="resend-btn">
                            Resend OTP
                        </button>

                    </p>

                </div>


                <!-- Message -->

                <div id="formMessage"></div>

            </form>


            <p
                class="mt-1"
                style="font-size: 0.85rem; color: var(--text-muted);">

                Don't have an account?

                <a href="register.html">
                    Register here
                </a>

            </p>

        </div>

    </div>


    <script src="../js/auth.js"></script>

</body>

</html>
