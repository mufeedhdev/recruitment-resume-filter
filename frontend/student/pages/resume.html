<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Resume</title>

    <link rel="stylesheet" href="../../shared/css/common.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar">

        <span class="brand">Recruitment Resume Filter</span>

        <div>
            <a href="dashboard.html">Dashboard</a>
            <a href="profile.html">Profile</a>
            <a href="education.html">Education</a>
            <a href="skills.html">Skills</a>
            <a href="resume.html">Resume</a>
            <a href="login.html">Logout</a>
        </div>

    </nav>


    <!-- Resume -->
    <div class="container">

        <div class="auth-card card">

            <span class="eyebrow">Student Portal</span>

            <h2>Resume</h2>

            <p class="login-description">
                Upload your latest resume for recruiters to review.
            </p>


            <form id="resumeForm">

                <!-- Resume Upload -->
                <div class="form-group">

                    <label for="resumeFile">
                        Upload Resume
                    </label>

                    <input
                        type="file"
                        id="resumeFile"
                        accept=".pdf,application/pdf"
                        required
                    >

                    <small
                        style="
                            display: block;
                            margin-top: 0.4rem;
                            color: var(--text-muted);
                        ">
                        PDF only. Maximum file size: 5 MB.
                    </small>

                </div>


                <!-- Selected Resume -->
                <div
                    id="resumeInfo"
                    style="
                        display: none;
                        margin-top: 1rem;
                        padding: 1rem;
                        border: 1px solid var(--border);
                        border-radius: var(--radius);
                        background: var(--paper);
                    ">

                    <strong>Selected Resume</strong>

                    <p
                        id="resumeFileName"
                        style="margin-top: 0.4rem;">
                    </p>

                    <p
                        id="resumeFileSize"
                        style="
                            font-size: 0.85rem;
                            color: var(--text-muted);
                        ">
                    </p>

                </div>


                <!-- Buttons -->
                <div
                    style="
                        display: flex;
                        gap: 0.75rem;
                        margin-top: 1.25rem;
                        flex-wrap: wrap;
                    ">

                    <button
                        type="submit"
                        class="btn btn-primary">
                        Save Resume
                    </button>

                    <button
                        type="button"
                        id="removeResumeBtn"
                        class="btn btn-secondary"
                        style="display: none;">
                        Remove
                    </button>

                </div>


                <!-- Message -->
                <div id="resumeMessage"></div>

            </form>

        </div>

    </div>


    <script>

        // ==========================================
        // RESUME UPLOAD
        // ==========================================

        const resumeForm =
            document.getElementById("resumeForm");

        const resumeFile =
            document.getElementById("resumeFile");

        const resumeInfo =
            document.getElementById("resumeInfo");

        const resumeFileName =
            document.getElementById("resumeFileName");

        const resumeFileSize =
            document.getElementById("resumeFileSize");

        const removeResumeBtn =
            document.getElementById("removeResumeBtn");

        const resumeMessage =
            document.getElementById("resumeMessage");


        // Maximum size: 5 MB

        const MAX_FILE_SIZE =
            5 * 1024 * 1024;


        // ==========================================
        // FILE SELECTION
        // ==========================================

        resumeFile.addEventListener("change", function () {

            const file = this.files[0];


            if (!file) {

                resumeInfo.style.display = "none";
                removeResumeBtn.style.display = "none";

                return;

            }


            // Check PDF

            if (
                file.type !== "application/pdf" &&
                !file.name.toLowerCase().endsWith(".pdf")
            ) {

                showMessage(
                    "Please upload a PDF file only.",
                    "error"
                );

                this.value = "";

                resumeInfo.style.display = "none";
                removeResumeBtn.style.display = "none";

                return;

            }


            // Check file size

            if (file.size > MAX_FILE_SIZE) {

                showMessage(
                    "Resume must be smaller than 5 MB.",
                    "error"
                );

                this.value = "";

                resumeInfo.style.display = "none";
                removeResumeBtn.style.display = "none";

                return;

            }


            // Display file information

            resumeFileName.textContent =
                file.name;

            resumeFileSize.textContent =
                "Size: " + formatFileSize(file.size);

            resumeInfo.style.display =
                "block";

            removeResumeBtn.style.display =
                "inline-block";

            resumeMessage.textContent = "";

        });


        // ==========================================
        // SAVE RESUME
        // ==========================================

        resumeForm.addEventListener("submit", function (event) {

            event.preventDefault();


            const file =
                resumeFile.files[0];


            if (!file) {

                showMessage(
                    "Please select your resume.",
                    "error"
                );

                return;

            }


            // Temporary frontend save

            console.log("Resume selected:", file);


            showMessage(
                "Resume selected successfully.",
                "success"
            );

        });


        // ==========================================
        // REMOVE RESUME
        // ==========================================

        removeResumeBtn.addEventListener(
            "click",
            function () {

                resumeFile.value = "";

                resumeInfo.style.display =
                    "none";

                removeResumeBtn.style.display =
                    "none";

                showMessage(
                    "Resume removed.",
                    "success"
                );

            }
        );


        // ==========================================
        // FORMAT FILE SIZE
        // ==========================================

        function formatFileSize(bytes) {

            if (bytes < 1024) {
                return bytes + " bytes";
            }

            if (bytes < 1024 * 1024) {
                return (bytes / 1024).toFixed(1) + " KB";
            }

            return (bytes / (1024 * 1024)).toFixed(2) + " MB";

        }


        // ==========================================
        // MESSAGE
        // ==========================================

        function showMessage(text, type) {

            resumeMessage.textContent =
                text;

            resumeMessage.className =
                "message " + type;

        }

    </script>

</body>

</html>
