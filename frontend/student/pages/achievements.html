<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Achievements</title>

    <link rel="stylesheet" href="../../shared/css/common.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar">

        <span class="brand">Recruitment Resume Filter</span>

        <div>
            <a href="dashboard.html">Dashboard</a>
            <a href="profile.html">Profile</a>
            <a href="education.html">Education</a>
            <a href="skills.html">Skills</a>
            <a href="resume.html">Resume</a>
            <a href="certifications.html">Certifications</a>
            <a href="achievements.html">Achievements</a>
            <a href="login.html">Logout</a>
        </div>

    </nav>


    <!-- Achievements -->
    <div class="container">

        <div class="card">

            <span class="eyebrow">Student Portal</span>

            <h2>Achievements</h2>

            <p class="login-description">
                Add your academic, technical, sports and other notable achievements.
            </p>


            <!-- Achievement List -->
            <div id="achievementList"></div>


            <!-- Add Achievement -->
            <button
                type="button"
                id="addAchievementBtn"
                class="btn btn-secondary"
                style="margin-top: 1rem;">
                + Add Achievement
            </button>


            <!-- Save -->
            <div style="margin-top: 1.5rem;">

                <button
                    type="button"
                    id="saveAchievementsBtn"
                    class="btn btn-primary">
                    Save Achievements
                </button>

            </div>


            <!-- Message -->
            <div id="achievementMessage"></div>

        </div>

    </div>


    <script>

        // ==========================================
        // ACHIEVEMENTS
        // ==========================================

        const achievementList =
            document.getElementById("achievementList");

        const addAchievementBtn =
            document.getElementById("addAchievementBtn");

        const saveAchievementsBtn =
            document.getElementById("saveAchievementsBtn");

        const achievementMessage =
            document.getElementById("achievementMessage");


        // ==========================================
        // ADD ACHIEVEMENT
        // ==========================================

        function addAchievement() {

            const achievementCard =
                document.createElement("div");

            achievementCard.className = "card";

            achievementCard.style.marginTop = "1.5rem";


            achievementCard.innerHTML = `

                <h3>Achievement</h3>


                <!-- Achievement Title -->

                <div class="form-group">

                    <label>
                        Achievement Title
                    </label>

                    <input
                        type="text"
                        class="achievementTitle"
                        placeholder="e.g. Winner of College Hackathon"
                        required
                    >

                </div>


                <!-- Category -->

                <div class="form-group">

                    <label>
                        Category
                    </label>

                    <select
                        class="achievementCategory"
                        required>

                        <option value="">
                            Select category
                        </option>

                        <option value="Academic">
                            Academic
                        </option>

                        <option value="Hackathon">
                            Hackathon
                        </option>

                        <option value="Competition">
                            Competition
                        </option>

                        <option value="Sports">
                            Sports
                        </option>

                        <option value="Leadership">
                            Leadership
                        </option>

                        <option value="Award">
                            Award
                        </option>

                        <option value="Scholarship">
                            Scholarship
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <!-- Organization -->

                <div class="form-group">

                    <label>
                        Organization / Institution
                    </label>

                    <input
                        type="text"
                        class="achievementOrganization"
                        placeholder="e.g. SASTRA University"
                        required
                    >

                </div>


                <!-- Date -->

                <div class="form-group">

                    <label>
                        Date
                    </label>

                    <input
                        type="date"
                        class="achievementDate"
                        required
                    >

                </div>


                <!-- Description -->

                <div class="form-group">

                    <label>
                        Description
                    </label>

                    <textarea
                        class="achievementDescription"
                        rows="4"
                        placeholder="Describe your achievement..."
                    ></textarea>

                </div>


                <!-- Proof -->

                <div class="form-group">

                    <label>
                        Proof / Certificate
                    </label>

                    <input
                        type="file"
                        class="achievementFile"
                        accept=".pdf,.jpg,.jpeg,.png"
                    >

                    <small
                        style="
                            display: block;
                            margin-top: 0.4rem;
                            color: var(--text-muted);
                        ">
                        PDF, JPG, JPEG or PNG. Maximum 5 MB.
                    </small>

                </div>


                <!-- Remove -->

                <button
                    type="button"
                    class="btn btn-secondary removeAchievementBtn">
                    Remove Achievement
                </button>

            `;


            achievementList.appendChild(
                achievementCard
            );


            // Remove achievement

            const removeButton =
                achievementCard.querySelector(
                    ".removeAchievementBtn"
                );


            removeButton.addEventListener(
                "click",
                () => {

                    achievementCard.remove();

                }
            );


            // File validation

            const achievementFile =
                achievementCard.querySelector(
                    ".achievementFile"
                );


            achievementFile.addEventListener(
                "change",
                function () {

                    const file =
                        this.files[0];


                    if (!file) {
                        return;
                    }


                    const allowedTypes = [
                        "application/pdf",
                        "image/jpeg",
                        "image/png"
                    ];


                    if (
                        !allowedTypes.includes(file.type)
                    ) {

                        showMessage(
                            "Proof must be PDF, JPG or PNG.",
                            "error"
                        );

                        this.value = "";

                        return;

                    }


                    // Maximum 5 MB

                    if (
                        file.size >
                        5 * 1024 * 1024
                    ) {

                        showMessage(
                            "Proof file must be smaller than 5 MB.",
                            "error"
                        );

                        this.value = "";

                    }

                }
            );

        }


        // ==========================================
        // ADD FIRST ACHIEVEMENT
        // ==========================================

        addAchievement();


        // ==========================================
        // ADD MORE ACHIEVEMENTS
        // ==========================================

        addAchievementBtn.addEventListener(
            "click",
            addAchievement
        );


        // ==========================================
        // SAVE ACHIEVEMENTS
        // ==========================================

        saveAchievementsBtn.addEventListener(
            "click",
            function () {

                const achievements =
                    document.querySelectorAll(
                        "#achievementList > .card"
                    );


                if (achievements.length === 0) {

                    showMessage(
                        "Please add at least one achievement.",
                        "error"
                    );

                    return;

                }


                const achievementData = [];


                for (
                    let i = 0;
                    i < achievements.length;
                    i++
                ) {

                    const card =
                        achievements[i];


                    const title =
                        card.querySelector(
                            ".achievementTitle"
                        ).value.trim();


                    const category =
                        card.querySelector(
                            ".achievementCategory"
                        ).value;


                    const organization =
                        card.querySelector(
                            ".achievementOrganization"
                        ).value.trim();


                    const date =
                        card.querySelector(
                            ".achievementDate"
                        ).value;


                    const description =
                        card.querySelector(
                            ".achievementDescription"
                        ).value.trim();


                    const file =
                        card.querySelector(
                            ".achievementFile"
                        ).files[0];


                    // Required fields

                    if (
                        !title ||
                        !category ||
                        !organization ||
                        !date
                    ) {

                        showMessage(
                            "Please fill in all required achievement fields.",
                            "error"
                        );

                        return;

                    }


                    achievementData.push({

                        title: title,

                        category: category,

                        organization:
                            organization,

                        date: date,

                        description:
                            description,

                        proofFile:
                            file
                                ? file.name
                                : null

                    });

                }


                // Temporary frontend save

                console.log(
                    "Achievement data:",
                    achievementData
                );


                showMessage(
                    "Achievements saved successfully.",
                    "success"
                );

            }
        );


        // ==========================================
        // MESSAGE
        // ==========================================

        function showMessage(text, type) {

            achievementMessage.textContent =
                text;

            achievementMessage.className =
                "message " + type;

        }

    </script>

</body>

</html>
