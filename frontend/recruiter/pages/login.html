<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Recruiter Login</title>

<link rel="stylesheet" href="../../shared/css/common.css">
<link rel="stylesheet" href="../css/auth.css">
</head>

<body>


<nav class="navbar">

  <span class="brand">Student Records</span>

  <div>
    <a href="../../index.html">Home</a>
    <a href="register.html">Register</a>
  </div>

</nav>


<div class="container">

  <div class="auth-card card">

    <span class="eyebrow">Recruiter Portal</span>

    <h2>Recruiter Login</h2>

    <p
      class="mt-1"
      style="color: var(--text-muted);"
    >
      Login using your recruiter account
    </p>


    <form id="loginForm" class="mt-2">


      <!-- Email -->

      <div class="form-group">

        <label for="email">
          Email ID
        </label>

        <input
          type="email"
          id="email"
          placeholder="123456789@sastra.ac.in"
          required
        >

        <small
          id="emailError"
          style="color: var(--error); display: none;"
        ></small>

      </div>


      <!-- Password -->

      <div class="form-group">

        <label for="password">
          Password
        </label>

        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          required
        >

        <small
          id="passwordError"
          style="color: var(--error); display: none;"
        ></small>

      </div>


      <!-- Login Button -->

      <button
        type="submit"
        class="btn btn-primary"
      >
        Login
      </button>


      <div id="formMessage"></div>


    </form>


    <p
      class="mt-1"
      style="font-size: 0.85rem; color: var(--text-muted);"
    >
      Don't have an account?
      <a href="register.html">Register here</a>
    </p>


  </div>

</div>


<script src="../js/auth.js"></script>

</body>
</html>
