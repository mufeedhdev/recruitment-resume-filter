<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Registration</title>

    <!-- Common CSS Reference -->
    <link rel="stylesheet" href="../../common.css">
</head>

<body>

    <!-- Header -->
    <header class="navbar">
        <div class="logo">
            Student Records
        </div>

        <nav>
            <!-- index.html Reference -->
            <a href="../../index.html">Home</a>
            <a href="login.html">Login</a>
        </nav>
    </header>


    <!-- Main Content -->
    <main class="auth-container">

        <div class="auth-card">

            <span class="eyebrow">
                STEP 1 OF 2
            </span>

            <h2>Admin Registration</h2>

            <p class="form-description">
                Create your admin account
            </p>


            <!-- Admin Registration Form -->
            <form>

                <!-- Full Name -->
                <div class="form-group">
                    <label for="name">Full Name</label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="e.g. Admin Name"
                        required
                    >
                </div>


                <!-- Admin ID -->
                <div class="form-group">
                    <label for="adminId">Admin ID</label>

                    <input
                        type="text"
                        id="adminId"
                        name="adminId"
                        placeholder="e.g. ADM001"
                        required
                    >
                </div>


                <!-- Email -->
                <div class="form-group">
                    <label for="email">Email</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="admin@example.com"
                        required
                    >
                </div>


                <!-- Phone -->
                <div class="form-group">
                    <label for="phone">Phone</label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="10-digit mobile number"
                        maxlength="10"
                        required
                    >
                </div>


                <!-- Department -->
                <div class="form-group">
                    <label for="department">Department</label>

                    <select id="department" name="department" required>
                        <option value="">Select department</option>
                        <option value="BCA">BCA</option>
                        <option value="BSc CS">B.Sc Computer Science</option>
                        <option value="BTech IT">B.Tech IT</option>
                        <option value="CSE">Computer Science Engineering</option>
                        <option value="ECE">Electronics and Communication</option>
                        <option value="EEE">Electrical and Electronics</option>
                    </select>
                </div>


                <!-- Role -->
                <div class="form-group">
                    <label for="role">Admin Role</label>

                    <select id="role" name="role" required>
                        <option value="">Select role</option>
                        <option value="super-admin">Super Admin</option>
                        <option value="placement-admin">Placement Admin</option>
                        <option value="department-admin">Department Admin</option>
                    </select>
                </div>


                <!-- Password -->
                <div class="form-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required
                    >
                </div>


                <!-- Confirm Password -->
                <div class="form-group">
                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Re-enter password"
                        required
                    >
                </div>


                <!-- Register Button -->
                <button type="submit" class="btn-primary">
                    Register
                </button>

            </form>


            <!-- Login Link -->
            <p class="auth-footer">
                Already have an account?
                <a href="login.html">Login here</a>
            </p>

            <!-- Back to Index -->
            <p class="auth-footer">
                <a href="../../index.html">
                    ← Back to Home
                </a>
            </p>

        </div>

    </main>

</body>
</html>
