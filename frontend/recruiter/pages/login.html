<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Recruiter Login</title>

<link rel="stylesheet" href="../../shared/css/common.css">
<link rel="stylesheet" href="../css/auth.css">

</head>


<body>


<nav class="navbar">

  <span class="brand">
    Student Records
  </span>

  <div>

    <a href="../../index.html">
      Home
    </a>

    <a href="register.html">
      Register
    </a>

  </div>

</nav>



<div class="container">

  <div class="auth-card card">

    <span class="eyebrow">
      Recruiter Portal
    </span>


    <h2>
      Welcome Back
    </h2>


    <p
      class="mt-1"
      style="color:var(--text-muted);">

      Login to access the recruiter dashboard.

    </p>



    <form
      id="recruiterLoginForm"
      class="mt-2">


      <div class="form-group">

        <label for="loginEmail">
          Email
        </label>

        <input
          type="email"
          id="loginEmail"
          placeholder="staff@sastra.ac.in"
          required
        >

        <small
          id="loginEmailError"
          style="color:var(--error); display:none;">
        </small>

      </div>



      <div class="form-group">

        <label for="loginPassword">
          Password
        </label>

        <input
          type="password"
          id="loginPassword"
          placeholder="Enter your password"
          required
        >

        <small
          id="loginPasswordError"
          style="color:var(--error); display:none;">
        </small>

      </div>



      <button
        type="submit"
        class="btn btn-primary">

        Login

      </button>


      <div id="loginMessage"></div>

    </form>



    <p
      class="mt-1"
      style="font-size:0.85rem; color:var(--text-muted);">

      Don't have an account?

      <a href="register.html">
        Register here
      </a>

    </p>

  </div>

</div>



<script src="../js/recruiter-auth.js"></script>

</body>

</html>
