<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Recruiter Registration</title>

<link rel="stylesheet" href="../../shared/css/common.css">
<link rel="stylesheet" href="../css/auth.css">
</head>

<body>

<nav class="navbar">
  <span class="brand">Student Records</span>

  <div>
    <a href="../../index.html">Home</a>
    <a href="login.html">Login</a>
  </div>
</nav>


<div class="container">

  <div class="auth-card card">

    <span class="eyebrow">Recruiter Portal</span>

    <h2>Create Recruiter Account</h2>

    <form id="recruiterRegisterForm" class="mt-2">

      <div class="form-group">
        <label for="name">Full Name</label>
        <input
          type="text"
          id="name"
          placeholder="Enter your name"
          required
        >
      </div>


      <div class="form-group">
        <label for="department">Department</label>

        <select id="department" required>
          <option value="">Select Department</option>
          <option value="CSE">CSE</option>
          <option value="ECE">ECE</option>
          <option value="BCA">BCA</option>
          <option value="B.Com">B.Com</option>
          <option value="Mathematics">Mathematics</option>
          <option value="Training & Placement">
            Training & Placement
          </option>
        </select>
      </div>


      <div class="form-group">
        <label for="staffId">Staff ID</label>

        <input
          type="text"
          id="staffId"
          placeholder="Enter Staff ID"
          required
        >
      </div>


      <div class="form-group">
        <label for="phone">Phone Number</label>

        <input
          type="tel"
          id="phone"
          placeholder="10-digit mobile number"
          maxlength="10"
          required
        >

        <small
          id="phoneError"
          style="color: var(--error); display:none;">
        </small>
      </div>


      <div class="form-group">
        <label for="email">Email</label>

        <input
          type="email"
          id="email"
          placeholder="staff@sastra.ac.in"
          required
        >

        <small
          id="emailError"
          style="color: var(--error); display:none;">
        </small>
      </div>


      <div class="form-group">
        <label for="password">Password</label>

        <input
          type="password"
          id="password"
          placeholder="Create a password"
          required
        >

        <small
          id="passwordError"
          style="color: var(--error); display:none;">
        </small>
      </div>


      <div class="form-group">
        <label for="confirmPassword">
          Confirm Password
        </label>

        <input
          type="password"
          id="confirmPassword"
          placeholder="Re-enter password"
          required
        >

        <small
          id="confirmPasswordError"
          style="color: var(--error); display:none;">
        </small>
      </div>


      <button
        type="submit"
        class="btn btn-primary">
        Register
      </button>


      <div id="formMessage"></div>

    </form>


    <p
      class="mt-1"
      style="font-size:0.85rem; color:var(--text-muted);">

      Already have an account?

      <a href="login.html">
        Login here
      </a>

    </p>

  </div>

</div>


<script src="../js/recruiter-auth.js"></script>

</body>
</html>
