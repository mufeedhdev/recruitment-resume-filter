<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password</title>

    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>

<body>

    <nav>
        <h2>Recruitment Portal</h2>

        <div>
            <a href="../index.html">Home</a>
            <a href="login.html">Login</a>
        </div>
    </nav>


    <div class="auth-container">

        <form id="forgotPasswordForm" class="auth-form">

            <h1>Forgot Password</h1>


            <label for="forgotEmail">
                Staff Email
            </label>

            <input
                type="email"
                id="forgotEmail"
                placeholder="example@sastra.ac.in"
                required
            >

            <span
                class="error"
                id="forgotEmailError">
            </span>


            <label for="newPassword">
                Create New Password
            </label>

            <input
                type="password"
                id="newPassword"
                maxlength="6"
                inputmode="numeric"
                placeholder="Enter exactly 6 digits"
                required
            >

            <span
                class="error"
                id="newPasswordError">
            </span>


            <label for="confirmNewPassword">
                Re-enter New Password
            </label>

            <input
                type="password"
                id="confirmNewPassword"
                maxlength="6"
                inputmode="numeric"
                placeholder="Re-enter 6 digit password"
                required
            >

            <span
                class="error"
                id="confirmNewPasswordError">
            </span>


            <button type="submit">
                Reset Password
            </button>

        </form>

    </div>


    <script src="../js/auth.js"></script>

</body>
</html>
