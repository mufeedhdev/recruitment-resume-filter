<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Forgot Password</title>

    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/auth.css">

</head>


<body>


<header class="topbar">

    <div class="brand">
        Recruitment Portal
    </div>

    <nav>

        <a href="../../index.html">
            Home
        </a>

        <a href="login.html">
            Login
        </a>

    </nav>

</header>



<div class="auth-container">

    <div class="auth-box">

        <h1>Forgot Password</h1>

        <p>Change your password</p>


        <form id="forgotForm">


            <label>Email Address</label>

            <input
                type="text"
                id="resetEmail"
                placeholder="example@sastra.ac.in"
            >

            <span
                id="resetEmailError"
                class="error">
            </span>



            <label>New Password</label>

            <input
                type="password"
                id="newPassword"
                maxlength="6"
                placeholder="Enter 6 characters"
            >

            <span
                id="newPasswordError"
                class="error">
            </span>



            <label>Confirm Password</label>

            <input
                type="password"
                id="resetConfirmPassword"
                maxlength="6"
                placeholder="Re-enter password"
            >

            <span
                id="resetConfirmPasswordError"
                class="error">
            </span>



            <button type="submit">
                Change Password
            </button>


        </form>

    </div>

</div>


<script src="../js/password.js"></script>


</body>
</html>
